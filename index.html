<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedule</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="top-header">
      <div class="brand">
        <span class="brand-icon">🗓️</span>
        <span class="brand-name">Schedule</span>
      </div>
      <div class="lock-note">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <span>Locked</span>
      </div>
    </header>

    <section class="hero-card">
      <div class="hero-info">
        <div class="hero-number" id="heroCount">0</div>
        <div class="hero-label">days logged this month</div>
      </div>
      <div class="hero-ring">
        <svg width="88" height="88" viewBox="0 0 88 88">
          <circle class="ring-track" cx="44" cy="44" r="37"/>
          <circle class="ring-progress" id="heroRing" cx="44" cy="44" r="37"/>
        </svg>
        <span class="ring-percent" id="heroPercent">0%</span>
      </div>
    </section>

    <section class="stats-row">
      <div class="stat-pill">
        <div class="stat-icon icon-green">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>
        </div>
        <div class="stat-value" id="statTotal">0</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat-pill">
        <div class="stat-icon icon-orange">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 4-4 5-4 9a4 4 0 0 0 8 0c0-1.5-1-2-1-3.5C17 10 19 12 19 15a7 7 0 1 1-14 0c0-5 4-6 7-13z"/></svg>
        </div>
        <div class="stat-value" id="statStreak">0</div>
        <div class="stat-label">Streak</div>
      </div>
      <div class="stat-pill">
        <div class="stat-icon icon-blue">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4z"/><path d="M7 5H4a2 2 0 0 0 2 4M17 5h3a2 2 0 0 1-2 4"/></svg>
        </div>
        <div class="stat-value" id="statLongest">0</div>
        <div class="stat-label">Best</div>
      </div>
    </section>

    <section class="calendar-card">
      <div class="calendar-topbar">
        <button id="prevMonth" class="nav-btn" aria-label="Previous month">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <h1 id="monthLabel"></h1>
        <button id="nextMonth" class="nav-btn" aria-label="Next month">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>

      <div class="weekdays">
        <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
      </div>

      <div id="calendarGrid" class="grid"></div>
    </section>

    <section class="recent-section">
      <div class="recent-header">
        <h2>Recent</h2>
      </div>
      <div id="recentList" class="recent-list"></div>
      <div id="recentEmpty" class="recent-empty hidden">No entries yet — tap + to add one.</div>
    </section>

    <div class="fab-wrap">
      <button id="fabAdd" class="fab" aria-label="Add entry">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </div>

  <div id="overlay" class="overlay hidden"></div>

  <div id="detailPanel" class="panel hidden">
    <div class="panel-handle"></div>
    <div class="panel-header">
      <h2 id="panelDate"></h2>
      <button id="closePanel" class="close-btn" aria-label="Close">&times;</button>
    </div>
    <p id="panelText" class="panel-text"></p>
    <div id="panelEmpty" class="panel-empty hidden">Nothing logged for this date.</div>
    <div class="panel-actions">
      <button id="editBtn" class="primary-btn">Edit</button>
      <button id="deleteBtn" class="danger-btn hidden">Delete</button>
    </div>
  </div>

  <div id="editPanel" class="panel hidden">
    <div class="panel-handle"></div>
    <div class="panel-header">
      <h2>Entry</h2>
      <button id="closeEditPanel" class="close-btn" aria-label="Close">&times;</button>
    </div>
    <label class="field-label" for="editDateInput">Date</label>
    <input type="date" id="editDateInput" class="date-input" />
    <label class="field-label" for="editText">Description</label>
    <textarea id="editText" rows="5" placeholder="What was done on this date..."></textarea>
    <div class="panel-actions">
      <button id="saveBtn" class="primary-btn">Save</button>
      <button id="cancelEditBtn" class="ghost-btn">Cancel</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
